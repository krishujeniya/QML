name: Build and deploy QML learning site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: lockfile
        name: Check whether the dependency lockfile is committed
        run: |
          if [ -f package-lock.json ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install from the committed lockfile or bootstrap it in CI
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi

      - name: Preserve the CI-generated lockfile for initial repository adoption
        if: steps.lockfile.outputs.committed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: qml-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Typecheck, verify README coverage, test math, and build
        run: npm run check

      - name: Install the browser for UI checks
        run: npx playwright install --with-deps chromium

      - name: Check routes, learning interactions, and responsive layouts
        run: npm run test:e2e

      - name: Upload rendered UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qml-ui-evidence
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
