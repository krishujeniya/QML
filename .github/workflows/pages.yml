name: Deploy QML site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site entry and content links
        run: |
          test -s index.html
          grep -q '<title>QML' index.html
          grep -q 'name="description"' index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.targets=[]
              def handle_starttag(self, tag, attrs):
                  self.targets.extend(v for k,v in attrs if k in ('href','src') and v and not v.startswith(('http:', 'https:', '#', 'mailto:')))
          parser=Links(); parser.feed(Path('index.html').read_text())
          missing=[x for x in parser.targets if not Path(x.split('#')[0]).exists()]
          if missing: raise SystemExit(f'Missing local links: {missing}')
          print(f'Validated {len(parser.targets)} local links')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
